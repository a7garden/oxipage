[workspace]
resolver = "2"
members = [
    "crates/oxipage-core",
    "crates/oxipage-ext-profile",
    "crates/oxipage-server",
]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros", "json", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
# macOS 27 dyld는 strip된 Mach-O dylib의 mis-aligned string pool을 거부한다
# (rust-lang/rust#157750). strip=debuginfo(기본값)가 proc-macro dylib 로딩을 깨므로 비활성화.
strip = "none"
