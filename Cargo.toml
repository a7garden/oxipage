[workspace]
resolver = "2"
members = [
    "crates/oxipage-core",
    "crates/oxipage-server",
    "crates/oxipage-cli",
    "crates/oxipage-wasm",
    "crates/oxipage-ext-wasm-demo",
    "crates/oxipage-ext-activity",
    "crates/oxipage-ext-blog",
    "crates/oxipage-ext-books",
    "crates/oxipage-ext-links",
    "crates/oxipage-ext-movies",
    "crates/oxipage-ext-novels",
    "crates/oxipage-ext-profile",
    "crates/oxipage-ext-projects",
    "crates/oxipage-ext-scraps",
    "crates/oxipage-admin",
]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
futures-core = "0.3"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros", "json", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = { version = "33", default-features = false, features = ["cranelift", "runtime", "parallel-compilation", "cache"] }
hmac = "0.12"

[profile.release]
lto = true
codegen-units = 1
# macOS 27 dyld는 strip된 Mach-O dylib의 mis-aligned string pool을 거부한다
# (rust-lang/rust#157750). strip=debuginfo(기본값)가 proc-macro dylib 로딩을 깨므로 비활성화.
strip = "none"
