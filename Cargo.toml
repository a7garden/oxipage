[workspace]
resolver = "2"
members = [
    "crates/oxibuilder-core",
    "crates/oxibuilder-console",
    "crates/oxibuilder-cli",
    "crates/oxibuilder-deploy",
    "crates/oxibuilder-wasm",

    "crates/oxibuilder-ext-wasm-demo",
    "crates/oxibuilder-ext-activity",
    "crates/oxibuilder-ext-blog",
    "crates/oxibuilder-ext-books",
    "crates/oxibuilder-ext-links",
    "crates/oxibuilder-ext-movies",
    "crates/oxibuilder-ext-novels",
    "crates/oxibuilder-ext-profile",
    "crates/oxibuilder-ext-projects",
    "crates/oxibuilder-ext-scraps",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
futures-core = "0.3"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
erased-serde = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros", "json", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = { version = "36", default-features = false, features = ["cranelift", "runtime", "parallel-compilation", "cache"] }
hmac = "0.12"
argon2 = "0.5"

dashmap = "6"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
[profile.release]
lto = true
codegen-units = 1
# macOS 27 dyld는 strip된 Mach-O dylib의 mis-aligned string pool을 거부한다
# (rust-lang/rust#157750). strip=debuginfo(기본값)가 proc-macro dylib 로딩을 깨므로 비활성화.
strip = "none"
