name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build web (for oxibuilder-core embedded SPA)
        run: |
          cd web && bun install && bun run build && bun run build:static

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Verify published crate bundles the SPA (P0-3)
        # `embedded-spa/` is .gitignored (a build artifact populated by `build.rs`
        # from `web/dist`). `--allow-dirty` lets `cargo package` see it.
        run: |
          set -euo pipefail
          pkg=$(cargo package --list -p oxibuilder-core --no-verify --allow-dirty)
          echo "$pkg" | grep -q 'embedded-spa/index.html$' \
            || { echo "FATAL: packaged crate is missing embedded-spa/index.html"; echo "$pkg"; exit 1; }
          echo "$pkg" | grep -q '_registry.json$' \
            || { echo "FATAL: packaged crate is missing _registry.json"; exit 1; }
          echo "$pkg" | grep -q '_wasm-demo.wasm$' \
            || { echo "FATAL: packaged crate is missing _wasm-demo.wasm"; exit 1; }
          echo "OK: published oxibuilder-core carries embedded-spa + registry + wasm demo"
