name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build web SPAs
        run: |
          cd web && bun install && bun run build && bun run build:static

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Publish — oxibuilder-core (Tier 0)
        run: cargo publish -p oxibuilder-core --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish — oxibuilder-wasm (Tier 0)
        run: cargo publish -p oxibuilder-wasm --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish — extensions (Tier 1)
        run: |
          cargo publish -p oxibuilder-ext-activity --no-verify --allow-dirty
          cargo publish -p oxibuilder-ext-blog --no-verify --allow-dirty
          cargo publish -p oxibuilder-ext-books --no-verify --allow-dirty
          cargo publish -p oxibuilder-ext-links --no-verify --allow-dirty
          cargo publish -p oxibuilder-ext-movies --no-verify --allow-dirty
          cargo publish -p oxibuilder-ext-novels --no-verify --allow-dirty
          cargo publish -p oxibuilder-ext-profile --no-verify --allow-dirty
          cargo publish -p oxibuilder-ext-projects --no-verify --allow-dirty
          cargo publish -p oxibuilder-ext-scraps --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish — oxibuilder-deploy (Tier 2)
        run: cargo publish -p oxibuilder-deploy --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish — oxibuilder-console (Tier 3)
        run: cargo publish -p oxibuilder-console --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish — oxibuilder-cli (Tier 4)
        run: cargo publish -p oxibuilder --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub release draft
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
