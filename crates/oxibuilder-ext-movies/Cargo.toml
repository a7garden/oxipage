[package]
name = "oxibuilder-ext-movies"
version = "0.8.0"
edition = "2024"
license.workspace = true
description = "영화/시리즈 리뷰 확장 — TMDB 연동, SeriesGroup 묶음 평가 (doc/02 §2.9)"

[lib]
name = "oxibuilder_ext_movies"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
erased-serde.workspace = true
oxibuilder-core = { version = "0.8.0", path = "../oxibuilder-core" }
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
