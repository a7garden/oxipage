[package]
name = "oxibuilder-core"
version = "0.10.0"
edition = "2024"
license.workspace = true
description = "Oxibuilder 코어 라이브러리 — Axum 서버 부트스트랩, SQLite 마이그레이션, Extension trait, SSR 스냅샷, 레이트리밋"

# Files packaged with `cargo publish`. Without `include`, Cargo respects
# `.gitignore`, which excludes `embedded-spa/` and the build-artifact WASM demo.
# The SPA must ship inside the published crate, otherwise `cargo install oxibuilder`
# produces a binary with a placeholder SPA and a broken `oxibuilder build` (P0-3).
include = [
    "src/**",
    "migrations/**",
    "embedded-spa/**",
    "embedded-spa-static/**",
    "_registry.json",
    "_wasm-demo.wasm",
    "build.rs",
    "Cargo.toml",
]

[lib]
name = "oxibuilder_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures-core.workspace = true
axum.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
erased-serde.workspace = true
mime_guess.workspace = true
reqwest.workspace = true
rayon.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
sha2.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
uuid.workspace = true
pulldown-cmark = "0.12"
# jpeg + gif decoders are pure-Rust (zune-jpeg / gif crate); webp feature pulls
# image-webp transitively. default-features = false drops rayon (no parallel
# decode at build time) and exr/ff/avif/dds/hdr/ico/pnm/qoi/tga which we don't need.
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Task 6 (movies-books-stats-parity + external-image-optimization) integration
# tests use the real `MoviesExtension` + `BooksExtension` builders so the
# migration-compat + external-image smoke paths run against production code,
# not a hand-rolled stub. Path deps keep the workspace offline-buildable.
oxibuilder-ext-books = { path = "../oxibuilder-ext-books" }
oxibuilder-ext-movies = { path = "../oxibuilder-ext-movies" }
# `net` for the local HTTP fixture in the external-image smoke test
# (optimize_external goes through reqwest → must hit a real http:// loopback).
tokio = { workspace = true, features = ["net"] }
