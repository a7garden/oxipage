[package]
name = "oxibuilder-ext-activity"
version = "0.8.0"
edition = "2024"
license.workspace = true
description = "GitHub 활동 스트림 확장 — Events API 폴링 및 webhook 수신 (doc/02 §2.8)"

[lib]
name = "oxibuilder_ext_activity"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
erased-serde.workspace = true
oxibuilder-core = { version = "0.8.0", path = "../oxibuilder-core" }
hmac.workspace = true
sha2.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
