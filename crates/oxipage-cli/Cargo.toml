[package]
name = "oxipage"
version = "0.2.0"
edition = "2024"
license.workspace = true
description = "Oxipage CLI — 블로그/프로젝트/링크/사이트 관리 커맨드라인 도구 (doc/04)"

[[bin]]
name = "oxipage"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
directories.workspace = true
oxipage-core = { version = "0.2.0", path = "../oxipage-core" }
oxipage-console = { version = "0.2.0", path = "../oxipage-console" }
rusqlite = { version = "0.32", features = ["serde_json"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http = { version = "0.6", features = ["fs"] }
