[package]
name = "oxipage"
version = "0.6.0"
edition = "2024"
license.workspace = true
description = "Oxipage CLI — 블로그/프로젝트/링크/사이트 관리 커맨드라인 도구 (doc/04)"

[[bin]]
name = "oxipage"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
directories.workspace = true
oxipage-core = { version = "0.6.0", path = "../oxipage-core" }
oxipage-console = { version = "0.6.0", path = "../oxipage-console" }
oxipage-ext-blog = { version = "0.6.0", path = "../oxipage-ext-blog" }
oxipage-ext-projects = { version = "0.6.0", path = "../oxipage-ext-projects" }
oxipage-ext-links = { version = "0.6.0", path = "../oxipage-ext-links" }
rusqlite = { version = "0.32", features = ["serde_json"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http = { version = "0.6", features = ["fs"] }

# `cargo install oxipage` ships only this member crate's manifest — the
# workspace-root [profile.release] does NOT travel in the published .crate
# tarball. macOS 27 dyld rejects the default `-C strip=debuginfo` output
# (mis-aligned LINKEDIT string pool, rust-lang/rust#157750), so the fix
# MUST live here for standalone installs to work. The workspace-build
# "profile in non-root package ignored" warning is the price of covering
# both paths.
[profile.release]
lto = true
codegen-units = 1
strip = "none"
